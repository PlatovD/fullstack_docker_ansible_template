- name: Render and build Docker Compose stack
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    project_root: "{{ (playbook_dir ~ '/..') | realpath }}"
    generated_dir: "{{ playbook_dir }}/.generated"
    rendered_compose_file: "{{ generated_dir }}/docker-compose.yml"
    up_after_build: false

  tasks:
    - name: Ensure generated directory exists
      ansible.builtin.file:
        path: "{{ generated_dir }}"
        state: directory
        mode: "0755"

    - name: Render docker-compose.yml from template
      ansible.builtin.template:
        src: "docker-compose.yml.j2"
        dest: "{{ rendered_compose_file }}"
        mode: "0644"